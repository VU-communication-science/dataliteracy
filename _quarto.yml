project:
  type: website
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
    - "chapters/*.qmd"
  resources:
    - components/

website:
  title: "Data Literacy"
  site-url: "https://dev.dataliteracy.cc"
  sidebar:
    style: "docked"
    collapse-level: 2
    contents:
      - href: index.qmd
        text: "Home"
      - href: chapters/curriculum.qmd
        text: "Curriculum & Skill Tree"
      - section: "Computational Skills"
        contents:
          - chapters/basic-computer-skills.qmd
          - chapters/r-language.qmd
          - chapters/reproducible-reports.qmd
      - section: "Data Management"
        contents:
          - chapters/data-frames.qmd
          - chapters/grouping-and-summarizing.qmd
          - chapters/data-cleaning.qmd
          - chapters/pivoting-and-joining.qmd
          - chapters/string-processing.qmd
      - section: "Statistical Foundations"
        contents:
          - chapters/means-and-variance.qmd
          - chapters/probability-and-sampling.qmd
          - chapters/correlation-and-covariance.qmd
          - chapters/effects.qmd
          - chapters/hypothesis-testing.qmd
          - chapters/causality.qmd
          - chapters/experimental-control.qmd
          - chapters/statistical-control.qmd
      - section: "Exploration and Measurement"
        contents:
          - chapters/descriptive-statistics.qmd
          - chapters/data-visualization.qmd
          - chapters/advanced-visualization.qmd
          - chapters/factor-analysis.qmd
          - chapters/scale-construction.qmd
      - section: "Inferential Statistics"
        contents:
          - chapters/comparing-two-groups.qmd
          - chapters/testing-associations.qmd
          - chapters/linear-models.qmd
          - chapters/anova.qmd
          - chapters/regression.qmd
          - chapters/linear-model-assumptions.qmd
          - chapters/power-analysis.qmd
          - chapters/mediation-analysis.qmd
      - section: "Content Analysis"
        contents:
          - chapters/text-as-data.qmd
          - chapters/manual-coding.qmd
          - chapters/machine-learning.qmd
          - chapters/text-classification.qmd

bibliography: references/references.bib
cls: references/apa7.cls

format:
  live-html:
    #df-print: tibble
    theme:
      - flatly
      - style.scss
    fontsize: 0.9em
    toc: true
    number-sections: false

engine: knitr
