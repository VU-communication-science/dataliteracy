name: Deploy Quarto site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bless:
        description: 'Re-bless all chapter hashes (accept current outputs as baseline)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            gsfonts \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglpk-dev \
            libmagick++-dev \
            libnode-dev \
            libx11-dev

      - name: Restore renv
        run: Rscript -e "renv::restore()"

      - name: Render Quarto Project
        id: render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Notify Maintainer on Build Failure
        if: failure() && steps.render.outcome == 'failure'
        run: |
          MSG="❌ **Book build failed!** One or more chapters failed to render.

          The live website was **not** updated to prevent publishing broken content.

          Please check the [workflow run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to see which chapter and code chunk caused the error."

          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$MSG" || echo "Note: Could not post commit comment"

      - name: Check Chapter Drift & Generate Status Page
        run: |
          BLESS_FLAG=""
          if [ "${{ github.event.inputs.bless }}" == "true" ]; then
            BLESS_FLAG="--bless"
          fi
          Rscript scripts/check_drift.R $BLESS_FLAG

      - name: Notify Maintainer on Silent Drift
        if: hashFiles('drift_detected.txt') != ''
        run: |
          DRIFT_COUNT=$(cat drift_detected.txt)
          MSG="⚠️ **Silent drift detected in $DRIFT_COUNT chapter(s)** during book build.

          One or more chapters produced different output without the chapter source having been edited (likely due to underlying data or dependency updates).

          🔗 View the details on the status page: https://dev.dataliteracy.cc/status"

          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="$MSG" || echo "Note: Could not post commit comment"

      - name: Commit Updated Hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f _chapter_hashes.json ] && ! git diff --quiet _chapter_hashes.json; then
            git add _chapter_hashes.json
            git commit -m "chore: update chapter hashes [skip ci]"
            git push origin main || echo "Hashes push failed"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
