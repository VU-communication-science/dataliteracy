name: Update R packages

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore renv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install quarto-live extension
        run: |
          mkdir -p _extensions/r-wasm/live
          touch _extensions/r-wasm/live/_knitr.qmd
          quarto add r-wasm/quarto-live --no-prompt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            gsfonts \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglpk-dev \
            libmagick++-dev \
            libnode-dev \
            libx11-dev

      - name: Restore current packages
        run: Rscript -e "renv::restore()"

      - name: Fetch previous build from gh-pages
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git worktree add /tmp/gh-pages FETCH_HEAD

            # Old docs for diff comparison (exclude freeze and any existing diffs)
            mkdir -p docs_old
            rsync -a --exclude='_freeze' --exclude='diffs' /tmp/gh-pages/ docs_old/

            # Restore freeze so unchanged chapters don't re-execute
            if [ -d "/tmp/gh-pages/_freeze" ]; then
              rsync -a /tmp/gh-pages/_freeze/ _freeze/
              echo "Freeze restored from gh-pages."
            fi

            git worktree remove /tmp/gh-pages --force
            echo "Previous build fetched."
          else
            echo "No gh-pages branch found — diffs and freeze restoration skipped."
          fi
        continue-on-error: true

      - name: Update packages
        run: |
          Rscript -e "renv::update()"
          Rscript -e "renv::snapshot()"

      - name: Check if lockfile changed
        id: lockfile
        run: |
          if git diff --quiet renv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "All packages are already up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Render with updated packages
        if: steps.lockfile.outputs.changed == 'true'
        id: render
        continue-on-error: true
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: live-html

      - name: Generate HTML diffs
        if: steps.lockfile.outputs.changed == 'true' && steps.render.outcome == 'success'
        run: |
          pip install --quiet beautifulsoup4
          python scripts/generate_diffs.py docs_old docs docs/diffs

      - name: Push preview to update-preview branch
        if: steps.lockfile.outputs.changed == 'true' && steps.render.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: update-preview
          force_orphan: true

      - name: Write PR body
        if: steps.lockfile.outputs.changed == 'true'
        run: |

          echo "## Package update $(date +%Y-%m-%d)" > pr_body.md
          echo "" >> pr_body.md

          if [ "${{ steps.render.outcome }}" == "failure" ]; then
            echo "## ⚠️ Render failed" >> pr_body.md
            echo "" >> pr_body.md
            echo "The book failed to render with the updated packages. Review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) before merging." >> pr_body.md
          else
            echo "## ✅ Render succeeded" >> pr_body.md
            echo "" >> pr_body.md
            echo "**[View preview and diffs](https://update-preview.dataliteracy.cc/diffs/)**" >> pr_body.md
          fi

          echo "" >> pr_body.md

          Rscript - << 'REOF' >> pr_body.md
          old_text <- system("git show HEAD:renv.lock", intern = TRUE)
          old_lock <- jsonlite::fromJSON(paste(old_text, collapse = "\n"))
          new_lock <- jsonlite::fromJSON(readLines("renv.lock"))

          old_pkgs <- old_lock$Packages
          new_pkgs <- new_lock$Packages

          updated <- Filter(function(pkg) {
            pkg %in% names(old_pkgs) &&
            new_pkgs[[pkg]]$Version != old_pkgs[[pkg]]$Version
          }, names(new_pkgs))

          added   <- setdiff(names(new_pkgs), names(old_pkgs))
          removed <- setdiff(names(old_pkgs), names(new_pkgs))

          cat("## Package changes\n\n")

          if (length(updated) > 0) {
            cat("### Updated\n\n")
            cat("| Package | From | To |\n")
            cat("|---------|------|----|\n")
            for (pkg in sort(updated)) {
              cat(sprintf("| %s | %s | %s |\n",
                pkg, old_pkgs[[pkg]]$Version, new_pkgs[[pkg]]$Version))
            }
            cat("\n")
          }

          if (length(added) > 0) {
            cat("### Added\n\n")
            cat(paste0("- ", sort(added), collapse = "\n"), "\n\n")
          }

          if (length(removed) > 0) {
            cat("### Removed\n\n")
            cat(paste0("- ", sort(removed), collapse = "\n"), "\n\n")
          }
          REOF

          echo "" >> pr_body.md
          echo "See the \`renv.lock\` diff for the full list of package changes." >> pr_body.md

      - name: Open pull request
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-renv-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add renv.lock
          git commit -m "chore: update renv packages $(date +%Y-%m-%d)"
          git push origin "$BRANCH"

          ASSIGNEE_FLAG=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ASSIGNEE_FLAG="--assignee ${{ github.actor }}"
          fi

          gh pr create \
            --title "chore: update R packages ($(date +%Y-%m-%d))" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH" \
            $ASSIGNEE_FLAG
