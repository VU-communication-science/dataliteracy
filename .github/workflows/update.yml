name: Update R packages

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 8am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore renv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install quarto-live extension
        run: |
          mkdir -p _extensions/r-wasm/live
          touch _extensions/r-wasm/live/_knitr.qmd
          quarto add r-wasm/quarto-live --no-prompt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            gsfonts \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglpk-dev \
            libmagick++-dev \
            libnode-dev \
            libx11-dev

      - name: Restore current packages
        run: Rscript -e "renv::restore()"

      - name: Update packages
        run: |
          Rscript -e "renv::update()"
          Rscript -e "renv::snapshot()"

      - name: Check if lockfile changed
        id: lockfile
        run: |
          if git diff --quiet renv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "All packages are already up to date."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Render with updated packages
        if: steps.lockfile.outputs.changed == 'true'
        id: render
        continue-on-error: true
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: live-html

      - name: Check chapter outputs for package drift
        if: steps.lockfile.outputs.changed == 'true' && steps.render.outcome == 'success'
        run: |
          Rscript scripts/check_drift.R

      - name: Write PR body
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          echo "## R Package Update $(date +%Y-%m-%d)" > pr_body.md
          echo "" >> pr_body.md

          if [ "${{ steps.render.outcome }}" == "failure" ]; then
            echo "### ⚠️ Render Failed" >> pr_body.md
            echo "" >> pr_body.md
            echo "The book failed to render with the updated packages. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." >> pr_body.md
          elif [ -f drift_details.md ]; then
            cat drift_details.md >> pr_body.md
            echo "" >> pr_body.md
          else
            echo "### ✅ All chapters rendered cleanly with no output drift." >> pr_body.md
            echo "" >> pr_body.md
          fi

          echo "" >> pr_body.md

          Rscript - << 'REOF' >> pr_body.md
          old_text <- system("git show HEAD:renv.lock", intern = TRUE)
          old_lock <- jsonlite::fromJSON(paste(old_text, collapse = "\n"))
          new_lock <- jsonlite::fromJSON(readLines("renv.lock"))

          old_pkgs <- old_lock$Packages
          new_pkgs <- new_lock$Packages

          updated <- Filter(function(pkg) {
            pkg %in% names(old_pkgs) &&
            new_pkgs[[pkg]]$Version != old_pkgs[[pkg]]$Version
          }, names(new_pkgs))

          added   <- setdiff(names(new_pkgs), names(old_pkgs))
          removed <- setdiff(names(old_pkgs), names(new_pkgs))

          cat("### Package Changes\n\n")

          if (length(updated) > 0) {
            cat("| Package | From | To |\n")
            cat("|---------|------|----|\n")
            for (pkg in sort(updated)) {
              cat(sprintf("| %s | %s | %s |\n",
                pkg, old_pkgs[[pkg]]$Version, new_pkgs[[pkg]]$Version))
            }
            cat("\n")
          }

          if (length(added) > 0) {
            cat("#### Added Packages\n\n")
            cat(paste0("- ", sort(added), collapse = "\n"), "\n\n")
          }

          if (length(removed) > 0) {
            cat("#### Removed Packages\n\n")
            cat(paste0("- ", sort(removed), collapse = "\n"), "\n\n")
          }
          REOF

      - name: Open or update pull request
        if: steps.lockfile.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-renv"
          git checkout -B "$BRANCH"
          git add renv.lock
          git commit -m "chore: update renv packages $(date +%Y-%m-%d)"
          git push origin "$BRANCH" --force

          # Check if PR already exists for this rolling branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "chore: update R packages ($(date +%Y-%m-%d))" \
              --body-file pr_body.md
          else
            ASSIGNEE_FLAG=""
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              ASSIGNEE_FLAG="--assignee ${{ github.actor }}"
            fi

            gh pr create \
              --title "chore: update R packages ($(date +%Y-%m-%d))" \
              --body-file pr_body.md \
              --base main \
              --head "$BRANCH" \
              $ASSIGNEE_FLAG
          fi
